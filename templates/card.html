<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <title>{{ card.title }}</title>
</head>
<body>
    <div class="container" style="max-width: 700px; margin-top: 50px;">
        <a href="{{ url_for('index') }}" style="display: inline-block; margin-bottom: 20px;">← Назад к записям</a>
        <div class="card" style="background-color: #ffffff;">
            <div class="card-body">
                <h1 class="card-title" style="font-size: 32px;">{{ card.title }}</h1>
                <h4 class="card-subtitle" style="margin-bottom: 20px;">{{ card.subtitle }}</h4>
                <hr style="border-color: #e2e8f0; margin-bottom: 20px;">
                <p class="card-text" style="white-space: pre-wrap; font-size: 16px;">{{ card.text }}</p>
            </div>
        </div>
    </div>
</body>
</html>
