<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <title>Новая запись</title>
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 50px;">
        <h1 style="text-align: center; margin-bottom: 30px;">Новая запись</h1>

        <form method="POST">
            <div class="form-group">
                <label>Заголовок</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>Подзаголовок</label>
                <input type="text" name="subtitle">
            </div>
            <div class="form-group">
                <label>Текст записи</label>
                <textarea name="text" rows="5" required></textarea>
            </div>
            <button type="submit" style="width: 100%;">Сохранить</button>
            <a href="{{ url_for('index') }}" class="btn-danger" style="display: block; text-align: center; margin-top: 15px; text-decoration: none; padding: 10px;">Отмена</a>
        </form>
    </div>
</body>
</html>
